<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body> 
        <header>
        <h1>Título</h1>       

        </header> 

        <main>
            <section class="form1" id="barra-comentario">
            <h2 > Deixe um comentário:</h2>
            <form>
                <label for="email">Seu e-mail:</label><br>
                <input type="email" id="email" name="user_email"<br><br>
                
                <label for="comment">Seu comentário:</label><br>
                <textarea id="comment" name="user_comment" rows="4" cols="50"> </textarea>
                
                <button type="submit">Enviar</button>

            </form>
        </section>

        </main>
        
        
    </body>
